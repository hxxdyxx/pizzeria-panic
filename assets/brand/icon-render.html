<!doctype html>
<html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"/vendor/three/three.module.min.js"}}</script>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '/vendor/three/addons/loaders/GLTFLoader.js';
const P = Object.fromEntries(new URLSearchParams(location.search));
const N = (k, d) => (P[k] !== undefined ? parseFloat(P[k]) : d);
const SIZE = N('size', 1024);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setSize(SIZE, SIZE); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = N('exp', 1.05);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(N('fov', 26), 1, 0.01, 50);

// Soft studio light, like the Chef app icon
scene.add(new THREE.HemisphereLight(0xffe6c8, 0x6a3010, N("hemi", 0.7)));
const key = new THREE.DirectionalLight(0xffffff, N("key", 1.9)); key.position.set(-1.2, 2.2, 3); scene.add(key);
const fill = new THREE.DirectionalLight(0xffe2b8, 0.9); fill.position.set(2, 0.8, 2); scene.add(fill);
const rim = new THREE.DirectionalLight(0xfff0c0, 1.6); rim.position.set(0, 2.5, -3); scene.add(rim);

const loader = new GLTFLoader();
const load = u => new Promise((res, rej) => loader.load(u, res, undefined, rej));
const [chefG, panG, pizzaG] = await Promise.all([load('/avatars/chef-3d.glb'), load('/assets/props/pan.glb'), load('/assets/props/pizza-pepperoni.glb')]);

const root = chefG.scene; const bones = {};
root.traverse(o => { if (o.isBone) bones[o.name] = o; if (o.isMesh) { o.frustumCulled = false; const m = o.material; if (m) { m.metalness = 0; m.roughness = N('rough', 0.85); m.envMapIntensity = 0; } } });
root.updateMatrixWorld(true);
let box = new THREE.Box3().setFromObject(root);
const s0 = 1 / (box.max.y - box.min.y); root.scale.setScalar(s0); root.position.y = -box.min.y * s0;
scene.add(root);
const mixer = new THREE.AnimationMixer(root);
const clip = chefG.animations.find(c => c.name === (P.clip || 'Idle_11')) || chefG.animations[0];
clip.tracks = clip.tracks.filter(t => t.name.endsWith('.quaternion'));
mixer.clipAction(clip).play(); mixer.update(N('t', 0.6));
root.updateMatrixWorld(true);

// Pan with a pizza stack, held at chest height in front of the Chef
const pan = new THREE.Group(); scene.add(pan);
const panR = N('panR', 0.19);
const panMesh = panG.scene; panMesh.scale.setScalar(panR / 0.8); pan.add(panMesh);
const stack = N('stack', 3);
for (let i = 0; i < stack; i++) {
  const z = pizzaG.scene.clone(true); z.scale.setScalar(panR / 0.8 * 0.92);
  z.position.y = panR / 0.8 * (0.17 + i * 0.2); z.rotation.y = i * 1.3 + 0.4; pan.add(z);
}
pan.position.set(0, N('panY', 0.42), N('panZ', 0.2));
pan.rotation.x = N('tilt', 0.32);
pan.updateMatrixWorld(true);

// Aim IK (same approach as js/render3d.js): each hand to the rim on its own side
const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _c = new THREE.Vector3(), _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _q3 = new THREE.Quaternion();
function aim(bone, child, target) {
  if (!bone || !child) return;
  bone.getWorldPosition(_a); child.getWorldPosition(_b);
  _b.sub(_a).normalize(); _c.copy(target).sub(_a).normalize();
  _q.setFromUnitVectors(_b, _c);
  bone.getWorldQuaternion(_q2); _q2.premultiply(_q);
  bone.parent.getWorldQuaternion(_q3).invert();
  bone.quaternion.copy(_q3.multiply(_q2)); bone.updateMatrixWorld(true);
}
const lSide = Math.sign(bones.LeftArm.getWorldPosition(_a).x - bones.RightArm.getWorldPosition(_b).x) || 1;
const grip = side => new THREE.Vector3(pan.position.x + side * panR * 0.95, pan.position.y - panR * 0.05, pan.position.z - panR * 0.15);
for (let i = 0; i < 3; i++) {
  aim(bones.LeftArm, bones.LeftForeArm, grip(lSide)); aim(bones.LeftForeArm, bones.LeftHand, grip(lSide));
  aim(bones.RightArm, bones.RightForeArm, grip(-lSide)); aim(bones.RightForeArm, bones.RightHand, grip(-lSide));
}

cam.position.set(N('cx', 0), N('cy', 0.62), N('cz', 2.4));
cam.lookAt(N('lx', 0), N('ly', 0.6), 0);
renderer.render(scene, cam);
window.ICON = renderer.domElement.toDataURL('image/png');
window.INFO = { clips: chefG.animations.map(c => c.name), lSide };
</script>
</body></html>
